[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zensical-carve"
version = "0.1.7"
description = "Carve markup support for Zensical, the successor to MkDocs"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "markup-carve" }]
keywords = ["zensical", "mkdocs", "carve", "markup", "documentation", "static-site-generator"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Documentation",
  "Topic :: Text Processing :: Markup",
]
dependencies = [
  # The Carve engine (the PyO3 binding over carve-rs). On `next2` it is the
  # unreleased Carve 0.2 binding, pinned to a carve-py `next2` commit and built
  # from source (Rust and maturin are needed). A direct-URL dependency cannot be
  # published to PyPI, so this branch is not releasable until carve-lang 0.2 is.
  "carve-lang @ git+https://github.com/markup-carve/carve-py@791e2061eb949b3fdc6193892814e31ccb1f3e07",
  "pygments-carve>=0.1.3,<0.2.0",
  "pymdown-extensions>=10.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
zensical = ["zensical>=0.0.56"]
dev = ["pytest>=8.0", "zensical>=0.0.56"]

[project.urls]
Homepage = "https://github.com/markup-carve/zensical-carve"
Source = "https://github.com/markup-carve/zensical-carve"
Issues = "https://github.com/markup-carve/zensical-carve/issues"
Changelog = "https://github.com/markup-carve/zensical-carve/blob/main/CHANGELOG.md"
Carve = "https://markup-carve.github.io/carve/"

[project.scripts]
zensical-carve = "zensical_carve.preprocess:main"

# The next2 engine pin is a git URL (see `dependencies`).
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/zensical_carve"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
