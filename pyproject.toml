[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zensical-carve"
version = "0.1.0"
description = "Carve markup support for Zensical, the successor to MkDocs"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "markup-carve" }]
keywords = ["zensical", "mkdocs", "carve", "markup", "documentation", "static-site-generator"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Documentation",
  "Topic :: Text Processing :: Markup",
]
dependencies = [
  # The Carve engine (the PyO3 binding over carve-rs).
  #
  # The floor is a claim about the oldest engine this package works with, not a
  # formality: 0.1.0 renders `srcset="safe.png 1x, javascript:alert(1) 2x"`
  # unsanitized, because a list-valued URL attribute was probed only on its
  # first entry, and 0.1.1 carries the fix. Measured through this package's own
  # `render` - see tests/test_engine_floor.py, which is what will report a
  # future engine regressing it. The floor moves when an older engine stops
  # working, not because a newer one exists.
  #
  # The ceiling follows from the engine's own versioning rather than from a
  # judgement about its API: on this org's 0.x line `0.1` is the major and the
  # third digit is the minor, so `<0.2.0` admits every engine minor (0.1.2,
  # 0.1.3, ...) and excludes only a release the engine itself declares breaking.
  # It is not a cap to relax at each engine minor; it is the point at which
  # someone has to look. Without it the range admits, by the engine's own rules,
  # exactly the changes that break this package.
  #
  # A range is the right shape for a consumer and the wrong one for a test run,
  # so CI installs under `constraints-ci.txt` instead. See that file.
  "carve-lang>=0.1.1,<0.2.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
zensical = ["zensical>=0.0.56"]
dev = ["pytest>=8.0", "zensical>=0.0.56"]

[project.urls]
Homepage = "https://github.com/markup-carve/zensical-carve"
Source = "https://github.com/markup-carve/zensical-carve"
Issues = "https://github.com/markup-carve/zensical-carve/issues"
Changelog = "https://github.com/markup-carve/zensical-carve/blob/main/CHANGELOG.md"
Carve = "https://markup-carve.github.io/carve/"

[project.scripts]
zensical-carve = "zensical_carve.preprocess:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zensical_carve"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
