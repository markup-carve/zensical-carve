name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      # Under `constraints-ci.txt`, so this job measures a stated engine rather
      # than whatever PyPI serves at the moment it runs. See that file.
      - name: Install
        run: pip install -e ".[dev]" -c constraints-ci.txt

      - name: Verify the engine this run measures
        run: |
          resolved="$(python -c 'from importlib.metadata import version; print(version("carve-lang"))')"
          pinned="$(sed -n 's/^carve-lang==\([^ ;#]*\).*/\1/p' constraints-ci.txt)"
          echo "carve-lang resolved=${resolved} pinned=${pinned}"
          if [ -z "$pinned" ]; then
            echo "::error::constraints-ci.txt names no carve-lang pin, so this run measured an unstated engine"
            exit 1
          fi
          if [ "$resolved" != "$pinned" ]; then
            echo "::error::installed carve-lang ${resolved} is not the pinned ${pinned}"
            exit 1
          fi

      - name: Test
        run: pytest -q

  # `render_with_includes` is on carve-py main and in no published carve-lang,
  # so the matrix job above skips every include test. This job is where they
  # run: it installs the engine revision named in `constraints-includes.txt` and
  # refuses to pass if the entry point is still missing, which is what stops the
  # skip from reading as a green.
  includes:
    name: Includes, against an engine that has them
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -e ".[dev]" -c constraints-ci.txt
          pip install --force-reinstall -r constraints-includes.txt

      - name: Verify the engine exposes the include entry point
        run: |
          python - <<'EOF'
          import carve, sys
          if not hasattr(carve, "render_with_includes"):
              print("::error::installed carve-lang exposes no render_with_includes")
              sys.exit(1)
          EOF

      - name: Test
        run: pytest -q tests/test_includes.py

  build:
    name: End-to-end build with Zensical
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]" -c constraints-ci.txt

      # This job renders a real site, so which engine drew it is the whole
      # question when the output changes. Stated, not inferred.
      - name: Verify the engine this run measures
        run: |
          resolved="$(python -c 'from importlib.metadata import version; print(version("carve-lang"))')"
          pinned="$(sed -n 's/^carve-lang==\([^ ;#]*\).*/\1/p' constraints-ci.txt)"
          echo "carve-lang resolved=${resolved} pinned=${pinned}"
          if [ -z "$pinned" ]; then
            echo "::error::constraints-ci.txt names no carve-lang pin, so this run measured an unstated engine"
            exit 1
          fi
          if [ "$resolved" != "$pinned" ]; then
            echo "::error::installed carve-lang ${resolved} is not the pinned ${pinned}"
            exit 1
          fi

      # The unit tests answer "does the package do what it says". This answers
      # the only question that matters to a user: does a real Zensical build
      # come out with the Carve in it. Both seams are exercised - the fence in
      # a Markdown page, and a whole .crv page through the preprocessor.
      - name: Build a site through both seams
        run: python tests/e2e_build.py
